# SPDX-License-Identifier: Apache-2.0
# External standards decern implements or aligns with.

rule: >-
  Before implementing or changing any standard-facing surface, fetch and READ
  the current spec at its url. Never work from memory — specs move.

standards:
  - name: AuthZEN Authorization API 1.0
    url: https://openid.net/specs/authorization-api-1_0.html
    surface:
      - crates/decern-server/src/decide.rs
      - crates/decern-server/src/routes.rs
    conformance: >-
      decern-serve exposes POST /access/v1/evaluation (and /decide as an alias): AuthZEN 1.0
      request (subject/resource {type,id}, action {name}, optional context) and response
      (boolean decision; any reasons under context). Reasons carry named policy ids on the
      builtin model, and the endpoint sits behind whichever caller posture the
      deployment names, which AuthZEN leaves to the deployment.
      Metadata discovery (access_evaluation_endpoint) is tracked as an open
      issue. Verified against the spec 2026-08-09.

  - name: OAuth 2.0 Token Exchange (RFC 8693)
    url: https://www.rfc-editor.org/rfc/rfc8693
    surface:
      - crates/decern-identity/src/exchange.rs
    conformance: >-
      `decern_identity::exchange` mints an attenuated child credential from a delegator's,
      following §1.1's delegation semantics: `clamp_delegation` narrows the requested scopes
      to those the delegator actually holds and caps the requested expiry at the delegator's
      own, so a child can never exceed its parent. The RFC's wire protocol is NOT implemented —
      there is no `/token` endpoint and no `grant_type=urn:ietf:params:oauth:grant-type:
      token-exchange` handler; what decern takes from RFC 8693 is the delegation model, not the
      HTTP surface. Verified against the spec 2026-08-08.

  - name: OAuth Decision Subject (draft-aravind-oauth-decision-subject-00)
    url: https://datatracker.ietf.org/doc/draft-aravind-oauth-decision-subject/
    surface:
      - crates/decern-server/src/decide.rs
      - crates/decern-ledger/src/lib.rs
    conformance: >-
      A decision records the party it was taken upon as a pseudonymous handle, with an optional
      scheme and purpose, distinct from the requesting subject and from the accountable owner.
      `decern-serve` strips it from the request context before the kernel runs, so it is recorded
      and never decides, and refuses an email-shaped handle or one redundant with the subject or
      resource owner. Resolving a handle to a person is out of scope here. Verified against the
      draft 2026-08-08.

  - name: Cedar policy language
    url: https://docs.cedarpolicy.com/
    surface:
      - crates/decern-kernel/src/
      - crates/decern-kernel/model/
    conformance: >-
      The policy, schema, and entities in model/ are Cedar; the engine is pinned
      to cedar-policy =4.11.2 in Cargo.toml.

  - name: Cedar symbolic compiler (cedar-policy-symcc)
    url: https://github.com/cedar-policy/cedar-spec
    surface:
      - crates/decern-proof/src/
    conformance: >-
      decern-proof compiles the Cedar model to SMT with cedar-policy-symcc — the
      Lean-verified symbolic compiler — and discharges the nine invariants as policy
      subsumption. The "proven" claim rests on this crate, so it is exact-pinned
      =0.5.3 in Cargo.toml, as tightly as the evaluator.

  - name: cvc5 SMT solver
    url: https://cvc5.github.io/
    surface:
      - crates/decern-proof/src/
    conformance: >-
      The proof obligations from cedar-policy-symcc are discharged by the cvc5 binary
      on PATH (or $CVC5); the proofs are developed and run against cvc5 1.3.1. An
      external tool, so it is not a Cargo dependency; `decern prove` fails closed if it
      is absent or a proof does not hold.

  - name: Ed25519 (RFC 8032)
    url: https://www.rfc-editor.org/rfc/rfc8032
    surface:
      - crates/decern-crypto/src/
    conformance: >-
      Ledger records, checkpoints and tree heads are signed with Ed25519 (EdDSA over
      edwards25519). Every verification path uses the strict check, which rejects the
      small-order public keys §5.1.7's permissive cofactorless equation admits — under
      those a single signature verifies for every message, so a key supplied by the
      party being audited could make any log verify. Each signed message is either a
      32-byte record hash or a tagged commitment string, so no signature over one is a
      valid signature over another. Verified against the spec 2026-08-08.

  - name: Certificate Transparency 2.0 (RFC 9162)
    url: https://www.rfc-editor.org/rfc/rfc9162
    surface:
      - crates/decern-ledger/src/merkle.rs
      - crates/decern-ledger/src/sharded.rs
    conformance: >-
      `decern_ledger::merkle` implements MTH, PATH and PROOF/SUBPROOF from §2.1 and the
      verifiers from §2.1.3, over leaves that are the per-record chain hashes, with the
      0x00/0x01 leaf/node domain separation. Only the tree and its proofs are taken from
      the RFC — decern is not a certificate log and issues no SCTs. Verified against the
      spec 2026-08-08.

  - name: JSON Web Signature (RFC 7515)
    url: https://www.rfc-editor.org/rfc/rfc7515
    surface:
      - crates/decern-server/src/bearer.rs
      - crates/decern-server/src/spiffe.rs
      - crates/decern-server/src/challenge.rs
    conformance: >-
      Standing tokens are compact-serialization JWS verified in `decern-server`:
      `alg` must be `EdDSA` (RFC 8037) and is checked before the signature, per the
      §5.2 validation order, so no other algorithm reaches a verification path.
      Base64url decoding rejects padding, which §2 requires be omitted. Only
      verification is implemented; decern issues no JWS. Verified 2026-08-08.

  - name: JSON Canonicalization Scheme (RFC 8785)
    url: https://www.rfc-editor.org/rfc/rfc8785
    surface:
      - crates/decern-ledger/src/jcs.rs
    conformance: >-
      `decern_ledger::jcs` implements JCS, and every entry in `Entry::digests` is a
      SHA-256 over a JCS canonical form — so a party holding the same value computes
      the same digest with any conformant implementation. Numbers follow §3.2.2.3
      (ECMAScript `Number::toString`), verified against V8 over 3.1M doubles. The
      hash chain itself does not canonicalize: it hashes each entry's exact stored
      bytes, and verification re-reads those same bytes. Verified against the spec
      2026-08-08.

  - name: JWT Profile for OAuth 2.0 Access Tokens (RFC 9068)
    url: https://www.rfc-editor.org/rfc/rfc9068
    surface:
      - crates/decern-server/src/bearer.rs
    conformance: >-
      `decern-server::bearer` validates access tokens in the §4 order: `typ` is
      `at+jwt`/`application/at+jwt` (case-insensitive per RFC 9110 §8.3.1), `alg`
      settled before any key is consulted, `iss` matched exactly, `aud` containing
      the configured resource identifier, then the signature, then `exp`/`nbf`.
      All §2.2 required claims (`iss`, `exp`, `aud`, `sub`, `client_id`, `iat`,
      `jti`) must be present; `jti` uniqueness and lifetime bounds remain the
      issuer's responsibility. Verification only — decern issues nothing.
      Verified against the spec 2026-08-08.

  - name: OAuth 2.0 Bearer Token Usage (RFC 6750)
    url: https://www.rfc-editor.org/rfc/rfc6750
    surface:
      - crates/decern-server/src/bearer.rs
      - crates/decern-server/src/spiffe.rs
    conformance: >-
      The `Authorization: Bearer` header field (§2.1) is the only accepted
      presentation; the form-encoded and query-parameter carriers are deliberately
      not implemented. Every refusal carries a §3 `WWW-Authenticate: Bearer`
      challenge: no error code when no credentials were presented, `invalid_token`
      for a token that fails validation, `insufficient_scope` with a `scope`
      attribute for a verified token missing a required scope. Challenge values are
      restricted to quoted-string-safe characters and bounded. Verified against the
      spec 2026-08-08.

  - name: Resource Indicators for OAuth 2.0 (RFC 8707)
    url: https://www.rfc-editor.org/rfc/rfc8707
    surface:
      - crates/decern-server/src/bearer.rs
    conformance: >-
      `--bearer-audience` names this deployment's resource identifier and a token's
      `aud` must contain it (§2), exactly — no prefix matching, string and array
      forms both accepted — so a token minted for any other resource the same
      issuer serves is refused. Verified against the spec 2026-08-08.

  - name: OAuth 2.1 (draft-ietf-oauth-v2-1-15)
    url: https://datatracker.ietf.org/doc/draft-ietf-oauth-v2-1/
    surface:
      - crates/decern-server/src/caller.rs
      - crates/decern-server/src/bearer.rs
    conformance: >-
      The protected-resource half only: bearer presentation per §5.1.1 (header
      field, scheme case-insensitive) and §5.3 error responses (401 for absent or
      invalid credentials, 403 for insufficient scope, each with its challenge).
      decern is not an authorization server and implements none of the grant
      machinery. Draft revision -15 read 2026-08-08; the draft moves, so re-read it
      before touching this surface.

  - name: HTTP Message Signatures (RFC 9421)
    url: https://www.rfc-editor.org/rfc/rfc9421
    surface:
      - crates/decern-server/src/sig.rs
    conformance: >-
      `decern-server::sig` verifies only, over a fixed profile rather than the RFC's full
      generality: covered components are `@method`, `@authority`, `@path` and
      `signature-key`, with `content-digest` added on any request carrying a body. An
      unrecognised `Signature-Input` parameter is refused rather than ignored (§2.3), so a
      signer cannot claim a property — `nonce`, `tag` — that nothing checked. `created` must
      fall inside a 60s freshness window with 5s of permitted skew ahead. §7.2.2 raises
      signature replay and §1.4 assigns replay handling to the application profile; this
      profile does not keep a nonce cache, so a verbatim replay verifies again inside the
      window (tracked as an open issue). Verified against the spec 2026-08-17.

  - name: Proof-of-Possession Key Semantics for JWTs (RFC 7800)
    url: https://www.rfc-editor.org/rfc/rfc7800
    surface:
      - crates/decern-server/src/sig.rs
    conformance: >-
      The token presented in `Signature-Key` carries a `cnf` claim in its claims set, and its
      `jwk` member names the key the request signature must be made with — so holding the
      token is not sufficient. Only the `jwk` confirmation member is implemented; `jwe`,
      `kid` and `jku` are not, and `jku` in particular would mean fetching key material,
      which no posture here does. The RFC leaves the proof mechanism to the protocol, and the
      mechanism here is the RFC 9421 signature over the request. Verified against the spec
      2026-08-17.

  - name: Digest Fields (RFC 9530)
    url: https://www.rfc-editor.org/rfc/rfc9530
    surface:
      - crates/decern-server/src/sig.rs
    conformance: >-
      `Content-Digest` is parsed as an RFC 8941 Dictionary and only `sha-256` is accepted;
      the registry's deprecated entries (`md5`, `sha`, `unixsum`, `unixcksum`, `adler`,
      `crc32c`) are not. The field covers content bytes as transmitted, and decern checks it
      against the same buffered bytes the handler will see rather than a re-serialization.
      The RFC allows a recipient to ignore digests and leaves stricter policy to the
      application: here the digest is a required covered component on a bodied request, so a
      captured signature cannot authorize a different body at the same path. Verified against
      the spec 2026-08-17.

  - name: SPIFFE JWT-SVID
    url: https://github.com/spiffe/spiffe/blob/main/standards/JWT-SVID.md
    surface:
      - crates/decern-server/src/spiffe.rs
    conformance: >-
      `decern-server::spiffe` verifies against a JWK Set pinned at startup; bundles are
      configured, never fetched, and SPIFFE Federation and the Workload API are not
      implemented. §2.1 permits nine algorithms and requires a validator to reject any other
      `alg`; of those, only `ES256` is accepted, because `RS*`/`PS*` need a crate carrying
      an unpatched key-recovery advisory this workspace's supply-chain gate refuses. EdDSA is
      not an option: it is outside §2.1's closed set, so accepting it would mean accepting a
      token every conformant validator must reject. The JOSE header set is closed to
      `alg`/`kid`/`typ` per §2, anything else refused rather than ignored. §3 requires only
      `sub`, `aud` and `exp`, so the issuer recorded is derived from the trust domain inside
      the verified `sub` rather than read from a claim. Trust domains match exactly; `kid` is
      mandatory on bundle entries (§6.1) even though optional on the token, and an ambiguous
      selection is refused rather than guessed. Verified against the spec 2026-08-17.

  - name: Signature-Key HTTP header (draft-hardt-httpbis-signature-key)
    url: https://datatracker.ietf.org/doc/draft-hardt-httpbis-signature-key/
    surface:
      - crates/decern-server/src/sig.rs
    conformance: >-
      The token binding the signing key travels in `Signature-Key`, and that header is itself
      one of the covered components — so tampering with any claim inside it invalidates the
      outer signature. That is why the token's own JWS signature is not separately verified:
      the outer signature already covers it, and a second check would establish nothing the
      first does not. A draft, so re-read it before touching this surface.

  - name: Model Context Protocol (revision 2026-07-28)
    url: https://modelcontextprotocol.io/specification/2026-07-28
    surface:
      - examples/mcp/
    conformance: >-
      Implemented ONLY in examples/mcp/server.py — decern's crates carry no MCP
      surface, deliberately. The example is a Streamable HTTP server for the
      stateless revision: single POST endpoint (GET/DELETE 405), no sessions, no
      SSE, server/discover, tools/list, tools/call; required
      MCP-Protocol-Version/Mcp-Method/Mcp-Name headers validated against body
      _meta with -32020/-32022/-32602 as the transport spec assigns them;
      RFC 9728 Protected Resource Metadata with authorization_servers; audience
      validation; the client token never forwarded upstream. Authorization
      failure layering per the spec's own tables: 401 invalid token, 403
      insufficient_scope for a satisfiable deny, isError tool results for
      business-logic denials. Earlier-revision clients (the
      2025-06-18 lifecycle: initialize, no per-request _meta) are served through
      the transport spec's backward-compatibility clause via a clearly-marked
      legacy path, verified end to end with Claude Code as the client. Sampling,
      elicitation, resources, prompts and subscriptions are not implemented.
      Verified against the spec 2026-08-09, including the backward-compatibility
      clause.

  - name: Forward-auth gateway contracts (NGINX auth_request / Traefik forwardAuth / Envoy ext_authz HTTP)
    url: https://nginx.org/en/docs/http/ngx_http_auth_request_module.html
    surface:
      - examples/ext_authz_adapter/
    conformance: >-
      Implemented ONLY in examples/ext_authz_adapter — decern's crates carry no
      gateway surface. The adapter answers the shared subrequest contract: 200
      allows, 403 denies, 503 refuses when no decision could be obtained.
      Identity, method and URI arrive as forwarded headers the gateway must set
      and strip from clients, and an incomplete forward is refused rather than
      defaulted. Traefik and Envoy consume the same status-code contract through
      their own configuration. Verified against the module documentation
      2026-08-09.
