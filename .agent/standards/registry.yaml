# SPDX-License-Identifier: Apache-2.0
# External standards decern implements or aligns with.

rule: >-
  Before implementing or changing any standard-facing surface, fetch and READ
  the current spec at its url. Never work from memory — specs move.

standards:
  - name: AuthZEN Authorization API 1.0
    url: https://openid.net/specs/authorization-api-1_0.html
    conformance: >-
      decern-serve exposes POST /access/v1/evaluation (and /decide as an alias): AuthZEN 1.0
      request (subject/resource {type,id}, action {name}, optional context) and response
      (boolean decision; any reasons under context). Metadata discovery
      (access_evaluation_endpoint) is a follow-up. Verified against the spec 2026-08-02.

  - name: Cedar policy language
    url: https://docs.cedarpolicy.com/
    conformance: >-
      The policy, schema, and entities in model/ are Cedar; the engine is pinned
      to cedar-policy =4.11.2 in Cargo.toml.

  - name: Ed25519 (RFC 8032)
    url: https://www.rfc-editor.org/rfc/rfc8032
    conformance: >-
      Ledger records, checkpoints and tree heads are signed with Ed25519 (EdDSA over
      edwards25519). Every verification path uses the strict check, which rejects the
      small-order public keys §5.1.7's permissive cofactorless equation admits — under
      those a single signature verifies for every message, so a key supplied by the
      party being audited could make any log verify. Each signed message is either a
      32-byte record hash or a tagged commitment string, so no signature over one is a
      valid signature over another. Verified against the spec 2026-08-08.

  - name: Certificate Transparency 2.0 (RFC 9162)
    url: https://www.rfc-editor.org/rfc/rfc9162
    conformance: >-
      `decern_ledger::merkle` implements MTH, PATH and PROOF/SUBPROOF from §2.1 and the
      verifiers from §2.1.3, over leaves that are the per-record chain hashes, with the
      0x00/0x01 leaf/node domain separation. Only the tree and its proofs are taken from
      the RFC — decern is not a certificate log and issues no SCTs. Verified against the
      spec 2026-08-08.

  - name: JSON Web Signature (RFC 7515)
    url: https://www.rfc-editor.org/rfc/rfc7515
    conformance: >-
      Standing tokens are compact-serialization JWS verified in `decern-server`:
      `alg` must be `EdDSA` (RFC 8037) and is checked before the signature, per the
      §5.2 validation order, so no other algorithm reaches a verification path.
      Base64url decoding rejects padding, which §2 requires be omitted. Only
      verification is implemented; decern issues no JWS. Verified 2026-08-08.

  - name: JSON Canonicalization Scheme (RFC 8785)
    url: https://www.rfc-editor.org/rfc/rfc8785
    conformance: >-
      `decern_ledger::jcs` implements JCS, and every entry in `Entry::digests` is a
      SHA-256 over a JCS canonical form — so a party holding the same value computes
      the same digest with any conformant implementation. Numbers follow §3.2.2.3
      (ECMAScript `Number::toString`), verified against V8 over 3.1M doubles. The
      hash chain itself does not canonicalize: it hashes each entry's exact stored
      bytes, and verification re-reads those same bytes. Verified against the spec
      2026-08-08.
