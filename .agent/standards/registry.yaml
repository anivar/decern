# SPDX-License-Identifier: Apache-2.0
# External standards decern implements or aligns with.
#
# Machine interface: python3 scripts/standards.py {check|for|brief|graph}
# Graph shape:       .agent/methods/standards-graph.md
#
# Every entry needs verified: YYYY-MM-DD (last read of the url) or pinned (version
# pin in Cargo / tool version is the claim). Update it in the same change that
# touches a surface.

rule: >-
  Before implementing or changing any standard-facing surface, fetch and READ
  the current spec at its url. Never work from memory — specs move.

# Deliberately not mapped to an external spec. A new file under a watched tree that
# is neither here nor in a surface list fails scripts/standards.py check.
non_surface:
  - crates/decern-server/src/main.rs
  - crates/decern-server/src/args.rs
  - crates/decern-server/src/boot.rs
  - crates/decern-server/src/state.rs
  - crates/decern-server/src/mission.rs
  - crates/decern-server/src/record.rs
  - crates/decern-server/src/audit.rs
  - crates/decern-server/src/testutil.rs

standards:
  - name: AuthZEN Authorization API 1.0
    url: https://openid.net/specs/authorization-api-1_0.html
    verified: 2026-10-09
    surface:
      - crates/decern-server/src/decide.rs
      - crates/decern-server/src/routes.rs
      - crates/decern-server/src/batch.rs
      - crates/decern-server/src/search.rs
      - crates/decern-server/src/discovery.rs
      - crates/decern-server/src/deployment.rs
      - crates/decern-server/src/authzen_certification/
      - examples/authzen-certification/
    conformance: >-
      decern-serve exposes POST /access/v1/evaluation (and /decide as an alias): AuthZEN 1.0
      request (subject/resource {type,id}, action {name}, optional context) and response
      (boolean decision; any reasons under context). Every malformed request is 400 and
      unknown top-level fields are ignored (§10.1.1). Subject, resource and action
      `properties` are carried as context.subject, context.resource and context.action
      where the action's schema declares them, from PEP-bound, bearer or trusted-front
      callers only (a caller bound to itself is 403 caller_mismatch); context the schema
      does not declare is dropped before evaluation at every declared record level (inside
      a set or an open record Cedar's own validation applies), since no validated policy
      can read it, while declared context keeps its schema validation; a context over
      64 KiB is 413; X-Request-ID is echoed (§10.1.3). Request entity types map onto the model's with
      --authzen-type-alias. GET /.well-known/authzen-configuration (§9) is served only with
      --public-url and advertises the decision point and the evaluation, evaluations and
      search endpoints, nothing unserved. POST /access/v1/evaluations (§7) carries several
      evaluations with top-level defaults an item replaces whole, the three semantics, and
      one record per evaluated item before the batch is served; an item that is not an
      evaluation is decision false with the reason in its context (§7.2.1). The three
      search endpoints (§8.4–8.6) decide every candidate of the searched type as an
      evaluation would be, over the same prepared context, answer in the request's type
      spelling, ignore the searched side's id (it reaches neither the decision nor the
      record), return every result in one page (no pagination, §8.2; a page.token is 400),
      bind no Mission and never list an action a decision would refuse for want of one,
      and are recorded once each over the context pruned to what the searched action (or
      any action) declares.
      The certification scenario's Basic, Batch and Search levels (Core and Properties)
      and Discovery run as tests against examples/authzen-certification/model. Reasons
      carry named policy ids on the builtin model, and
      the endpoint sits behind whichever caller posture the deployment names, which AuthZEN
      leaves to the deployment. Verified against the spec 2026-10-09.

  - name: OAuth 2.0 Token Exchange (RFC 8693)
    url: https://www.rfc-editor.org/rfc/rfc8693
    verified: 2026-08-08
    surface:
      - crates/decern-identity/src/exchange.rs
    conformance: >-
      `decern_identity::exchange` mints an attenuated child credential from a delegator's,
      following §1.1's delegation semantics: `clamp_delegation` narrows the requested scopes
      to those the delegator actually holds and caps the requested expiry at the delegator's
      own, so a child can never exceed its parent. The RFC's wire protocol is NOT implemented —
      there is no `/token` endpoint and no `grant_type=urn:ietf:params:oauth:grant-type:
      token-exchange` handler; what decern takes from RFC 8693 is the delegation model, not the
      HTTP surface. Verified against the spec 2026-08-08.

  - name: OAuth Decision Subject (draft-aravind-oauth-decision-subject-00)
    url: https://datatracker.ietf.org/doc/draft-aravind-oauth-decision-subject/
    verified: 2026-10-20
    surface:
      - crates/decern-server/src/decide.rs
      - crates/decern-ledger/src/record.rs
    conformance: >-
      A decision records the party it was taken upon as a pseudonymous handle, with an optional
      scheme and purpose, distinct from the requesting subject and from the accountable owner.
      `decern-serve` takes it from `context.decision_subject` (§5) and strips it from the request
      context before the kernel runs, so it is recorded and never decides (§4). It refuses a
      handle containing `@`, an address §6 forbids, and drops one equal to the request's subject
      or the resource's owner, where §3 says the claim is omitted. One reference per decision:
      §9's array form is refused. Resolving a handle to a person is out of scope here. Verified
      against the draft 2026-10-20.

  - name: Cedar policy language
    url: https://docs.cedarpolicy.com/
    verified: pinned
    surface:
      - crates/decern-kernel/src/
      - crates/decern-kernel/model/
    conformance: >-
      The policy, schema, and entities in model/ are Cedar; the engine is pinned
      to cedar-policy =4.13.0 in Cargo.toml.

  - name: Cedar symbolic compiler (cedar-policy-symcc)
    url: https://github.com/cedar-policy/cedar-spec
    verified: pinned
    surface:
      - crates/decern-proof/src/
    conformance: >-
      decern-proof compiles the Cedar model to SMT with cedar-policy-symcc — the
      Lean-verified symbolic compiler — and discharges the nine invariants as policy
      subsumption. The "proven" claim rests on this crate, so it is exact-pinned
      =0.7.0 in Cargo.toml, as tightly as the evaluator.

  - name: cvc5 SMT solver
    url: https://cvc5.github.io/
    verified: pinned
    surface:
      - crates/decern-proof/src/
    conformance: >-
      The proof obligations from cedar-policy-symcc are discharged by the cvc5 binary
      on PATH (or $CVC5); the proofs are developed and run against cvc5 1.3.1. An
      external tool, so it is not a Cargo dependency; `decern prove` fails closed if it
      is absent or a proof does not hold.

  - name: Ed25519 (RFC 8032)
    url: https://www.rfc-editor.org/rfc/rfc8032
    verified: 2026-08-08
    surface:
      - crates/decern-crypto/src/
    conformance: >-
      Ledger records, checkpoints and tree heads are signed with Ed25519 (EdDSA over
      edwards25519). Every verification path uses the strict check, which rejects the
      small-order public keys §5.1.7's permissive cofactorless equation admits — under
      those a single signature verifies for every message, so a key supplied by the
      party being audited could make any log verify. Each signed message is either a
      32-byte record hash or a tagged commitment string, so no signature over one is a
      valid signature over another. Verified against the spec 2026-08-08.

  - name: Certificate Transparency 2.0 (RFC 9162)
    url: https://www.rfc-editor.org/rfc/rfc9162
    verified: 2026-08-08
    surface:
      - crates/decern-ledger/src/merkle.rs
      - crates/decern-ledger/src/sharded.rs
    conformance: >-
      `decern_ledger::merkle` implements MTH, PATH and PROOF/SUBPROOF from §2.1 and the
      verifiers from §2.1.3.2 and §2.1.4.2, over leaves that are the per-record chain
      hashes, with the 0x00/0x01 leaf/node domain separation. Only the tree and its proofs
      are taken from the RFC — decern is not a certificate log and issues no SCTs. Verified
      against the spec 2026-08-08. Erratum 8670 (held for document update) read 2026-10-19:
      the verifiers keep the original text's `fn == 0` loop exit, which is never taken.

  - name: JSON Web Signature (RFC 7515)
    url: https://www.rfc-editor.org/rfc/rfc7515
    verified: 2026-10-19
    surface:
      - crates/decern-server/src/bearer.rs
      - crates/decern-server/src/spiffe.rs
      - crates/decern-server/src/aauth.rs
      - crates/decern-server/src/sig.rs
      - crates/decern-server/src/challenge.rs
      - crates/decern-server/src/jose.rs
    conformance: >-
      Standing tokens are compact-serialization JWS verified in `decern-server`:
      `alg` must be `EdDSA` (RFC 8037) and is checked before the signature, so no
      other algorithm reaches a verification path. Every reader decodes its segments
      through `jose.rs`: base64url without padding (§2) into strict JSON, trailing
      characters refused (§10.12), a duplicated member name kept last in a map and,
      for a member a derived struct declares, refused there (§4 permits either; a
      member the struct does not declare is ignored). `crit` (§4.1.11, MUST be
      understood and processed): bearer and standing tokens refuse it whatever its
      value. SPIFFE and AAuth refuse every header outside `alg`/`kid`/`typ`, `crit`
      included: JWT-SVID §2 forbids an SVID any other, while the AAuth draft names
      those three (§11.5.1) without closing the set, so for AAuth the closed set is
      this deployment's own. The signed-request bound token is not verified as a JWS —
      the request signature covers it — and its header is read for `typ` and `alg`
      alone. A standing token's other header parameters are ignored, as §4 requires of
      ones not understood. Only verification is
      implemented; decern issues no JWS. Read in full 2026-10-19; of its errata, only
      7767 is open (reported, §6) and it does not bear on these surfaces.

  - name: JSON Web Token (RFC 7519)
    url: https://www.rfc-editor.org/rfc/rfc7519
    verified: 2026-10-19
    surface:
      - crates/decern-server/src/jose.rs
      - crates/decern-server/src/challenge.rs
      - crates/decern-server/src/bearer.rs
      - crates/decern-server/src/spiffe.rs
      - crates/decern-server/src/aauth.rs
    conformance: >-
      `jose.rs` reads a NumericDate claim (§2) as any JSON number, fractional
      included, and refuses a present claim that is not a number rather than reading
      it as absent; reads `aud` as one string or an array of them, matched exactly
      (§4.1.3); claim sets decode as §7.2 steps 9–10 require. Which claims are
      required, and the `exp`/`nbf` checks themselves, are each reader's own; a
      standing token, a JWT no other spec here profiles, requires `exp`, which §4.1.4
      leaves optional, and is refused before an `nbf` that is present (§4.1.5), with
      no leeway beyond the whole second the server's clock is read in. Read in
      full 2026-10-19 with its errata: verified erratum 8060 makes §7.2 step 5 defer
      to RFC 7515, under which a header parameter not understood is ignored unless
      `crit` names it; reported erratum 7720 (never reject an `iat` in the future) is
      not adopted: the AAuth posture refuses one past its skew window.

  - name: JSON Canonicalization Scheme (RFC 8785)
    url: https://www.rfc-editor.org/rfc/rfc8785
    verified: 2026-08-08
    surface:
      - crates/decern-ledger/src/jcs.rs
    conformance: >-
      `decern_ledger::jcs` implements JCS, and every entry in `Entry::digests` is a
      SHA-256 over a JCS canonical form — so a party holding the same value computes
      the same digest with any conformant implementation. Numbers follow §3.2.2.3
      (ECMAScript `Number::toString`), verified against V8 over 3.1M doubles. The
      hash chain itself does not canonicalize: it hashes each entry's exact stored
      bytes, and verification re-reads those same bytes. Verified against the spec
      2026-08-08. Erratum 7920 (verified) read 2026-10-19: it has a parser raise an
      error on `-0`, as a SHOULD; `jcs` serializes `-0` as `0` and refuses nothing.

  - name: JWT Profile for OAuth 2.0 Access Tokens (RFC 9068)
    url: https://www.rfc-editor.org/rfc/rfc9068
    verified: 2026-10-19
    surface:
      - crates/decern-server/src/bearer.rs
    conformance: >-
      `decern-server::bearer` validates access tokens in the §4 order: `typ` is
      `at+jwt`/`application/at+jwt` (case-insensitive per RFC 9110 §8.3.1), `alg`
      settled before any key is consulted, `iss` matched exactly, `aud` containing
      the configured resource identifier, then the signature, then `exp`/`nbf`.
      All §2.2 required claims (`iss`, `exp`, `aud`, `sub`, `client_id`, `iat`,
      `jti`) must be present; `jti` uniqueness and lifetime bounds remain the
      issuer's responsibility. A failure answers `invalid_token` and a missing
      required scope `insufficient_scope` (§4, RFC 6750 §3.1). The keys are the ones
      the operator configures, never fetched, which §4's "MUST use the keys provided
      by the authorization server" allows. Not met: §2.1 requires a conforming
      resource server to "include RS256 (as defined in [RFC7518]) among their
      supported signature algorithms", and this posture verifies `EdDSA` only, so it
      is not a conforming RFC 9068 resource server. RS256 needs RSA verification the
      supply-chain gate does not admit today; the decision is
      https://github.com/anivar/decern/issues/226. Verification only — decern issues
      nothing. Read in full 2026-10-19.

  - name: OAuth 2.0 Bearer Token Usage (RFC 6750)
    url: https://www.rfc-editor.org/rfc/rfc6750
    verified: 2026-08-08
    surface:
      - crates/decern-server/src/bearer.rs
      - crates/decern-server/src/spiffe.rs
    conformance: >-
      The `Authorization: Bearer` header field (§2.1) is the only accepted
      presentation; the form-encoded and query-parameter carriers are deliberately
      not implemented. Every refusal carries a §3 `WWW-Authenticate: Bearer`
      challenge: no error code when no credentials were presented, `invalid_token`
      for a token that fails validation, `insufficient_scope` with a `scope`
      attribute for a verified token missing a required scope. Challenge values are
      restricted to quoted-string-safe characters and bounded. Verified against the
      spec 2026-08-08.

  - name: Resource Indicators for OAuth 2.0 (RFC 8707)
    url: https://www.rfc-editor.org/rfc/rfc8707
    verified: 2026-08-08
    surface:
      - crates/decern-server/src/bearer.rs
    conformance: >-
      `--bearer-audience` names this deployment's resource identifier and a token's
      `aud` must contain it (§2), exactly — no prefix matching, string and array
      forms both accepted — so a token minted for any other resource the same
      issuer serves is refused. Verified against the spec 2026-08-08.

  - name: OAuth 2.1 (draft-ietf-oauth-v2-1-15)
    url: https://datatracker.ietf.org/doc/draft-ietf-oauth-v2-1/
    verified: 2026-08-08
    surface:
      - crates/decern-server/src/caller.rs
      - crates/decern-server/src/bearer.rs
    conformance: >-
      The protected-resource half only: bearer presentation per §5.1.1 (header
      field, scheme case-insensitive) and §5.3 error responses (401 for absent or
      invalid credentials, 403 for insufficient scope, each with its challenge).
      decern is not an authorization server and implements none of the grant
      machinery. Draft revision -15 read 2026-08-08; the draft moves, so re-read it
      before touching this surface.

  - name: HTTP Message Signatures (RFC 9421)
    url: https://www.rfc-editor.org/rfc/rfc9421
    verified: 2026-10-19
    surface:
      - crates/decern-server/src/httpsig.rs
      - crates/decern-server/src/sig.rs
      - crates/decern-server/src/aauth.rs
    conformance: >-
      Verification only. `decern-server::httpsig` holds what the RFC fixes. `Signature-Input`
      and `Signature` are parsed as structured fields (§4.1, §4.2) from every line of each,
      combined (§2.1). Covered values are derived as §2.1 and §2.2 define: `@method` as
      received (§2.2.1), `@authority` as host and optional port with the host lowercased
      (§2.2.3), from an absolute-form request target when there is one and from a single
      `Host` otherwise (a missing or repeated `Host` is refused), and header fields combined
      across lines. `@signature-params` is the parsed input serialized again (§2.3, §3.2 step 7),
      not the bytes received. A component parameter (`sf`, `key`, `bs`, `req`, `tr`,
      `name`) is refused, as §2.5 requires of one the verifier does not implement. Of the
      derived components only `@method`, `@authority` and `@path` are computed, the ones a
      profile here requires: `@target-uri` and `@scheme` need the scheme, which a server
      behind a TLS-terminating front does not see, and for that reason `@authority` keeps a
      default port where §2.2.3 drops it. Both signature postures apply one profile (§1.4): exactly one signature,
      labelled `sig1`; covered components exactly `@method`, `@authority`, `@path` and
      `signature-key`, with `content-digest` before `signature-key` on any request carrying
      a body; `created` required and `keyid` shape-checked, never used to choose a key; any
      other parameter refused rather than ignored (§2.3), so a signer cannot claim a
      property such as `nonce` or `tag` that nothing checked; `created` no more than 60s old
      and no more than 5s ahead; Ed25519 only. §7.2.2 raises replay and §3.2.1 leaves nonce
      enforcement to the application; there is no nonce cache, so a verbatim replay verifies
      again inside the window. A label repeated in either field is refused (§4), and the
      fixed label departs from §7.2.5's advice not to rely on one, so a relabelled signature
      is refused. The RFC's Ed25519 vectors (Appendix B.2.6, B.4) are tests. Errata 8102 and
      8103 (verified) rename `@signature-input` to `@signature-params` in two passages and
      change nothing implemented. Read in full 2026-10-19.

  - name: Structured Field Values for HTTP (RFC 9651)
    url: https://www.rfc-editor.org/rfc/rfc9651
    verified: 2026-10-19
    surface:
      - crates/decern-server/src/httpsig.rs
    conformance: >-
      `Signature-Input` and `Signature` are parsed as Dictionaries by the `sfv` crate, never
      by hand, from every line of the field combined (§4.2). RFC 9421 references RFC 8941,
      so §2.4 keeps Dates and Display Strings out of those two fields and the parser is held
      to RFC 8941. A failed parse refuses the request (§4.2). §4.2.2 keeps the last of a
      repeated key, but RFC 9421 §4 requires each label to be unique, so the keys are read
      in a first pass and a repeat is refused before that rule could fold it away. `Content-Digest` is
      not parsed here; see the RFC 9530 entry. Erratum 8869 (verified) adds Display String to
      §3.3's list and changes nothing implemented. Read in full 2026-10-19.

  - name: Proof-of-Possession Key Semantics for JWTs (RFC 7800)
    url: https://www.rfc-editor.org/rfc/rfc7800
    verified: 2026-08-17
    surface:
      - crates/decern-server/src/sig.rs
    conformance: >-
      The token presented in `Signature-Key` carries a `cnf` claim in its claims set, and its
      `jwk` member names the key the request signature must be made with — so holding the
      token is not sufficient. Only the `jwk` confirmation member is implemented; `jwe`,
      `kid` and `jku` are not, and `jku` in particular would mean fetching key material,
      which no posture here does. The RFC leaves the proof mechanism to the protocol, and the
      mechanism here is the RFC 9421 signature over the request. Verified against the spec
      2026-08-17.

  - name: Digest Fields (RFC 9530)
    url: https://www.rfc-editor.org/rfc/rfc9530
    verified: 2026-08-17
    surface:
      - crates/decern-server/src/sig.rs
    conformance: >-
      `Content-Digest` is parsed as an RFC 8941 Dictionary and only `sha-256` is accepted;
      the registry's deprecated entries (`md5`, `sha`, `unixsum`, `unixcksum`, `adler`,
      `crc32c`) are not. The field covers content bytes as transmitted, and decern checks it
      against the same buffered bytes the handler will see rather than a re-serialization.
      The RFC allows a recipient to ignore digests and leaves stricter policy to the
      application: here the digest is a required covered component on a bodied request, so a
      captured signature cannot authorize a different body at the same path. Verified against
      the spec 2026-08-17.

  - name: SPIFFE JWT-SVID
    url: https://github.com/spiffe/spiffe/blob/main/standards/JWT-SVID.md
    verified: 2026-10-19
    surface:
      - crates/decern-server/src/spiffe.rs
    conformance: >-
      `decern-server::spiffe` verifies against a JWK Set pinned at startup; bundles are
      configured, never fetched, and SPIFFE Federation and the Workload API are not
      implemented. §2.1 permits nine algorithms and requires a validator to reject any other
      `alg`; of those, only `ES256` is accepted, because `RS*`/`PS*` need a crate carrying
      an unpatched key-recovery advisory this workspace's supply-chain gate refuses. EdDSA is
      not an option: it is outside §2.1's closed set, so accepting it would mean accepting a
      token every conformant validator must reject. The JOSE header set is closed to
      `alg`/`kid`/`typ` per §2, anything else refused rather than ignored. §3 requires only
      `sub`, `aud` and `exp`, so the issuer recorded is derived from the trust domain inside
      the verified `sub` rather than read from a claim. Trust domains match exactly; `kid` is
      mandatory on bundle entries (§6.1) even though optional on the token, and an ambiguous
      selection is refused rather than guessed. Read in full 2026-10-19.

  - name: Signature-Key HTTP header (draft-hardt-httpbis-signature-key)
    url: https://datatracker.ietf.org/doc/draft-hardt-httpbis-signature-key/
    verified: 2026-10-19
    surface:
      - crates/decern-server/src/sig.rs
      - crates/decern-server/src/aauth.rs
    conformance: >-
      The token binding the signing key travels in `Signature-Key`, and that header is itself
      one of the covered components (§7.8) — so tampering with any claim inside it
      invalidates the outer signature. That is why the signed-request posture does not
      verify the token's own JWS signature: the outer signature already covers it, and the
      key it confirms must be the one configured for the agent. Neither posture meets -09
      as written. The signed-request posture carries the token as the whole `Signature-Key`
      value, not as a dictionary member under the `jwt` scheme (§3, §3.8). AAuth splits the
      header by hand for one `sig=jwt;jwt="…"` member rather than parsing it as a
      Dictionary (§3 step 2), and does not correlate its label with `Signature-Input` (§3
      steps 3–4): it takes the member under `sig` while verifying the signature labelled
      `sig1`.
      Neither reads a JWK's `alg`, which §3.3 requires present, fully specified and
      consistent with `kty`/`crv`; both refuse a `Signature-Input` `alg` parameter that §7.4
      has a verifier ignore; and no refusal carries `Signature-Error` (§5) except AAuth's
      `clock_skew`. Read in full 2026-10-19 against -09 (2026-09-13).

  - name: AAuth Protocol (draft-hardt-oauth-aauth-protocol)
    url: https://datatracker.ietf.org/doc/draft-hardt-oauth-aauth-protocol/
    verified: 2026-10-20
    surface:
      - crates/decern-server/src/aauth.rs
    conformance: >-
      The resource half of **agent identity access** (§4.2.1) only. Person identity access
      verifies a person token and is not implemented. Resource-managed access has the
      resource run its own authorization interaction (§4.2.2), and PS authorization and
      federated access need a Person Server's resource tokens; decern runs no interaction and
      issues no token: ROADMAP non-goals. `decern-server::aauth` verifies an `aa-agent+jwt`
      presented in `Signature-Key` under the `jwt` scheme, its own signature against the
      provider key, then the request signature against the key its `cnf` confirms. Providers
      are pinned, never discovered: §11.4 and §11.5.2 have a verifier fetch the issuer's JWKS
      via `{iss}/.well-known/{dwk}`, and this deployment instead checks that `dwk` names
      `aauth-agent.json` and selects from a JWK Set the operator configured. That is a
      deviation, not something the draft provides for; an agent whose provider is not
      configured is refused before any cryptography. `content-digest` is required on a
      bodied request, a component §11.2.4 lets a resource declare in
      `additional_signature_components`; this deployment publishes no resource metadata and
      the refusal names no component, so an agent cannot learn of it from the protocol. An agent token carries no `aud`, so
      `--aauth-audience` is required and the request's authority must equal it. `jti` is
      required and shape-checked, not used for replay detection. `parent_agent` is
      shape-checked and never reaches the kernel. A verified agent is a workload and binds
      to itself unless listed in `--pep`. A request with no agent token is answered 401 with
      `AAuth-Requirement: requirement=agent-token` (§6.1); an `iat` ahead of this clock by
      more than 5s is refused with `Signature-Error: error=clock_skew` (§11.5.2); a token
      claiming a lifetime above 24 hours is refused (§5.3.1, a verifier policy). Not met,
      so a conformant agent is refused today: the token header must carry the polymorphic
      `alg: EdDSA`, which §11.3.1 and §11.5.1 forbid in favour of `Ed25519`; the token is
      taken from the `Signature-Key` member labelled `sig` while the signature verified is
      labelled `sig1`, and §11.3.4 step 4 selects the member by the signature's label, so no
      conformant agent satisfies both; the covered components must be exactly this profile's list in its
      order, where §11.3.4 step 2 asks only that the required ones be covered; an `alg`
      signature parameter is refused where §11.3.3.2 says to ignore it, and `expires` is
      refused where §11.3.4.2 says to honour it; `created` may be 5s ahead, not the 60s
      window §11.3.4 step 3 defaults to. Not met, accepted where the draft refuses: a JWK
      with no `alg`, or one whose `alg` disagrees with `kty`/`crv` (§11.3.1); a `ps` or
      `iss` that is not a server identifier (§11.1.1); a `parent_agent` that is not an agent
      identifier (§5.3.3). Signature failures other than `clock_skew` carry no
      `Signature-Error` (§11.3.4) and the body is not problem details (§11.9.2). Read in
      full 2026-10-19 against -11 (2026-09-25).
      Agent identifiers follow §5.2: `aauth:local@domain`, the local part non-empty and at
      most 255 characters of letters, digits, `-`, `_`, `+` and `.`, the domain a lowercase
      host; a token whose `sub` is not in the issuing provider's domain (§5.1, §11.2.1) is
      refused, as is a `parent_agent` that is not an agent identifier (§5.3.3 step 3). A
      provider identifier is checked to §11.1.1, `https://` and a lowercase host alone.
      Sections 5, 11.1.1, 11.2.1 and 11.5.2 of -11 read again in full 2026-10-20.

  - name: Model Context Protocol (revision 2026-07-28)
    url: https://modelcontextprotocol.io/specification/2026-07-28
    verified: 2026-08-09
    surface:
      - examples/mcp/
    conformance: >-
      Implemented ONLY in examples/mcp/server.py — decern's crates carry no MCP
      surface, deliberately. The example is a Streamable HTTP server for the
      stateless revision: single POST endpoint (GET/DELETE 405), no sessions, no
      SSE, server/discover, tools/list, tools/call; required
      MCP-Protocol-Version/Mcp-Method/Mcp-Name headers validated against body
      _meta with -32020/-32022/-32602 as the transport spec assigns them;
      RFC 9728 Protected Resource Metadata with authorization_servers; audience
      validation; the client token never forwarded upstream. Authorization
      failure layering per the spec's own tables: 401 invalid token, 403
      insufficient_scope for a satisfiable deny, isError tool results for
      business-logic denials. Earlier-revision clients (the
      2025-06-18 lifecycle: initialize, no per-request _meta) are served through
      the transport spec's backward-compatibility clause via a clearly-marked
      legacy path, verified end to end with a shipping client. Sampling,
      elicitation, resources, prompts and subscriptions are not implemented.
      Verified against the spec 2026-08-09, including the backward-compatibility
      clause.

  - name: Forward-auth gateway contracts (NGINX auth_request / Traefik forwardAuth / Envoy ext_authz HTTP)
    url: https://nginx.org/en/docs/http/ngx_http_auth_request_module.html
    verified: 2026-08-09
    surface:
      - examples/ext_authz_adapter/
    conformance: >-
      Implemented ONLY in examples/ext_authz_adapter — decern's crates carry no
      gateway surface. The adapter answers the shared subrequest contract: 200
      allows, 403 denies, 503 refuses when no decision could be obtained.
      Identity, method and URI arrive as forwarded headers the gateway must set
      and strip from clients, and an incomplete forward is refused rather than
      defaulted. Traefik and Envoy consume the same status-code contract through
      their own configuration. Verified against the module documentation
      2026-08-09.
