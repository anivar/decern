# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decern"
version = "0.3.1"
description = "Ask a decern server whether an action is allowed, and get a decision that is recorded to a tamper-evident log. Dependency-free AuthZEN 1.0 client."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []
authors = [{ name = "Anivar A Aravind" }]
keywords = ["authorization", "authzen", "pdp", "access-control", "ai-agents", "audit"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://decern.anivar.net/"
Source = "https://github.com/anivar/decern"
Issues = "https://github.com/anivar/decern/issues"
Changelog = "https://github.com/anivar/decern/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["decern"]
