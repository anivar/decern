# SPDX-License-Identifier: Apache-2.0
[package]
name = "substrate_egress_extproc"
version = "0.7.0"
edition = "2024"
license = "Apache-2.0"
description = "Envoy ext_proc adapter that authorizes Agent Substrate actor egress against an AuthZEN 1.0 PDP such as decern-serve"
repository = "https://github.com/anivar/decern"
publish = false

# Empty table: this example is its own workspace, detached from decern's.
[workspace]

[lib]
name = "substrate_egress_extproc"
path = "src/lib.rs"

[[bin]]
name = "substrate-egress-extproc"
path = "src/main.rs"

[dependencies]
# ext_proc gRPC front (the Envoy ExternalProcessor service).
tonic = { version = "0.14", features = ["transport", "tls-ring"] }
prost = "0.14"
envoy-types = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
# AuthZEN PDP client (pure-Rust HTTP, no TLS — loopback/in-cluster plaintext to the PDP).
http = "1"
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1"] }
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"

[dev-dependencies]
# A stub AuthZEN PDP for the integration tests.
axum = "0.8"
