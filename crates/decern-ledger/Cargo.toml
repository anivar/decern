[package]
name = "decern-ledger"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Append-only, Ed25519-signed, hash-chained tamper-evident decision ledger."
repository.workspace = true

[dependencies]
decern-crypto = { workspace = true }
# ShardedLedger composes decern-store's LedgerHeadStore seam
# (the Postgres-backed multi-replica coordination) — decern-store has no
# dependency back on decern-ledger, so this is a one-way, non-circular addition.
decern-store = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
ryu = { workspace = true }
serde = { workspace = true }
# raw_value: entries are hashed as their exact stored bytes (RawValue), so
# verification never re-serializes. Declared here (not inherited from a sibling's
# feature) so an isolated `-p decern-ledger` build has it too.
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = { workspace = true }
thiserror = { workspace = true }
