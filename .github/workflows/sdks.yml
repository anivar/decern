# SPDX-License-Identifier: Apache-2.0
name: SDKs

# The `ci` workflow is Cargo only, so until this existed nothing verified
# sdks/go, sdks/python or sdks/typescript on any push. Each has a test suite
# that passes locally; none of them ran here, which means a break would have
# surfaced first to whoever depended on a client rather than to us.
#
# No path filter. Filtering to sdks/** would skip these jobs on a change that
# alters what a client is written against, and the jobs are cheap enough that
# the saved minutes are not worth reasoning about which changes can reach them.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod holds the floor the module claims to support; building on
          # exactly that version is what catches a use of a newer builtin.
          go-version-file: sdks/go/go.mod
          # No cache-dependency-path: the client is stdlib only, so the module
          # has no go.sum and setup-go errors on a path it cannot resolve.
          cache: false

      - run: go build ./...

      - run: go vet ./...

      # gofmt exits 0 whether or not it reformatted anything, so the check is
      # that it named no files.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - run: go test ./...

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The floor declared in pyproject.toml (for the same reason as Go)
        # plus current stable, absorbed from the retired sdk-python workflow.
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # The client declares no dependencies and the suite uses unittest, so
      # there is nothing to install. Discovery runs from the package root so
      # `decern` imports from the tree rather than from an installed copy.
      - name: unittest
        run: python -m unittest discover -s tests -t .

  typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The active LTS line, which is what the package declares support for.
        # npm ci stays strict: a lockfile that no longer installs is a failure to
        # report, not something to fall back from.
        node-version: [24]
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json

      # The npm the publish workflow installs, read from that file so the two cannot drift:
      # a publish cannot be rehearsed, so its npm is tried here on every change.
      - name: Install the npm a publish uses
        run: |
          pin="$(sed -n 's/.*npm install -g npm@\([0-9][0-9.]*\) .*/\1/p' "${GITHUB_WORKSPACE}/.github/workflows/publish-sdks.yml")"
          [ -n "${pin}" ] || { echo "::error::publish-sdks.yml installs no exact npm version"; exit 1; }
          npm install -g "npm@${pin}"
          node --version
          [ "$(npm --version)" = "${pin}" ] || { echo "::error::npm is $(npm --version), not ${pin}"; exit 1; }

      - run: npm ci

      # `npm test` runs tsc and then node --test over the emitted dist, so the
      # type check is part of the test step rather than a separate one.
      - run: npm test

      # What a publish would pack, without a registry: the build is already in dist. The
      # package must hold every file package.json names as `main`, as `types` and under
      # `exports`, and nothing under `dist/tests`, where the build writes the compiled tests.
      - name: npm pack --dry-run
        run: |
          npm pack --dry-run --json > "${RUNNER_TEMP}/pack.json"
          files="$(jq -r '.. | objects | select(has("files")) | .files[].path' "${RUNNER_TEMP}/pack.json")"
          printf '%s\n' "${files}"
          wants="$(jq -r '[.main, .types, (.exports | .. | strings)] | map(select(. != null) | ltrimstr("./")) | unique | .[]' package.json)"
          [ -n "${wants}" ] || { echo "::error::package.json names no entry file"; exit 1; }
          while IFS= read -r want; do
            printf '%s\n' "${files}" | grep -qxF -- "${want}" || { echo "::error::the package lacks ${want}"; exit 1; }
          done <<<"${wants}"
          if printf '%s\n' "${files}" | grep -q '^dist/tests/'; then
            echo "::error::the package holds files under dist/tests"; exit 1
          fi
