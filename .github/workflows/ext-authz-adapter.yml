# SPDX-License-Identifier: Apache-2.0
name: ext-authz-adapter

# Standalone workflow for examples/ext_authz_adapter because code outside
# the workspace is not compiled by scripts/verify.sh.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ext-authz-adapter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/ext_authz_adapter
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust toolchain (honors rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add clippy rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: examples/ext_authz_adapter

      - name: Build adapter
        run: cargo build

      - name: Lint adapter (Clippy)
        run: cargo clippy --all-targets -- -D warnings

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run integration tests
        run: cargo test
