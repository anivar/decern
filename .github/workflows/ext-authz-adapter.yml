# SPDX-License-Identifier: Apache-2.0
name: ext-authz-adapter

# Standalone workflow for examples/ext_authz_adapter because code outside
# the workspace is not compiled by scripts/verify.sh.
# No `paths:` filter, deliberately: the job reports on every PR — a red row is visible
# where the merge happens — and skips its own steps when nothing it tests changed.
# Merge gating stays the maintainer's call.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ext-authz-adapter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/ext_authz_adapter
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Decide whether anything this job tests changed
        id: relevant
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch -q origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
              | grep -qE '^(examples/ext_authz_adapter/|[.]github/workflows/ext-authz-adapter[.]yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "nothing this job tests changed; reporting success without running"
          fi

      - name: Install Rust toolchain (honors rust-toolchain.toml)
        if: steps.relevant.outputs.run == 'true'
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add clippy rustfmt

      - name: Cache cargo
        if: steps.relevant.outputs.run == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: examples/ext_authz_adapter

      - name: Build adapter
        if: steps.relevant.outputs.run == 'true'
        run: cargo build

      - name: Lint adapter (Clippy)
        if: steps.relevant.outputs.run == 'true'
        run: cargo clippy --all-targets -- -D warnings

      - name: Check formatting
        if: steps.relevant.outputs.run == 'true'
        run: cargo fmt -- --check

      - name: Install cargo-deny
        if: steps.relevant.outputs.run == 'true'
        run: cargo install cargo-deny --locked

      - name: Check supply-chain (cargo-deny)
        if: steps.relevant.outputs.run == 'true'
        run: cargo deny check

      - name: Run integration tests
        if: steps.relevant.outputs.run == 'true'
        run: cargo test

