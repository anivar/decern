# SPDX-License-Identifier: Apache-2.0
name: Release

on:
  push:
    tags: ["v*"]

# Read-only by default. The build matrix only checks out and compiles; the two write grants
# the release needs are scoped to the one job that signs and publishes, below, so a step
# running in the matrix never holds a token that can create a release or mint an OIDC
# identity.
permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} -p decern-cli -p decern-server

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/decern${{ matrix.ext }}"       "dist/decern-${{ matrix.target }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/decern-serve${{ matrix.ext }}" "dist/decern-serve-${{ matrix.target }}${{ matrix.ext }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # cosign keyless signing via OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist

      - name: Combined SHA256SUMS
        run: |
          cd dist
          sha256sum decern-* > SHA256SUMS

      - name: SBOM (CycloneDX)
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json
          find . -name '*.cdx.json' -exec cp {} dist/ \;

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # cosign 3 writes one Sigstore bundle per file — signature, certificate and the
      # transparency-log entry in a single `.sigstore.json` — in place of the `.sig` and
      # `.pem` pair earlier releases shipped. SECURITY.md says how to verify either.
      - name: Sign artifacts (keyless)
        run: |
          cd dist
          for f in decern-* SHA256SUMS; do
            [ -f "$f" ] || continue
            case "$f" in *.sigstore.json|*.cdx.json) continue;; esac
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      # The release notes are the CHANGELOG section for this tag — the entries contributors
      # wrote alongside their changes. A generated list of pull-request titles says what was
      # merged; this says what the release does.
      # A release candidate (`v0.4.0-rc.1`) is the dry run of this workflow: it is published
      # as a pre-release from the CHANGELOG section of the version it rehearses, and the
      # publish workflows skip it. Only the final tag reaches a registry.
      - name: Release notes from CHANGELOG
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          base="${version%%-rc.*}"
          if [ "${base}" != "${version}" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          awk -v v="${base}" '
            $0 ~ "^## \\[" v "\\]" { inside = 1; next }
            inside && /^## \[/     { exit }
            inside                 { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${base}"
            exit 1
          fi
          echo "Release notes for ${version} (section ${base}):"
          cat notes.md

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: notes.md
          files: dist/*
          prerelease: ${{ steps.notes.outputs.prerelease == 'true' }}
