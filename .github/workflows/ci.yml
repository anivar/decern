# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A weekly run on an unchanged tree: the supply-chain gate (`cargo deny`) and the
  # proofs can go red without a commit — a new advisory, a yanked crate, a solver
  # release — and a badge that only reflects the last push would keep reading green.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # cvc5 static release used by the proof suite.
  CVC5_TAG: cvc5-1.3.4

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (honors rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add clippy rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install cvc5
        run: |
          curl -sSfL -o /tmp/cvc5.zip \
            "https://github.com/cvc5/cvc5/releases/download/${CVC5_TAG}/cvc5-Linux-x86_64-static.zip"
          unzip -q /tmp/cvc5.zip -d /tmp/cvc5
          sudo install -m 0755 /tmp/cvc5/cvc5-Linux-x86_64-static/bin/cvc5 /usr/local/bin/cvc5
          cvc5 --version

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      # One canonical loop — identical to what contributors run locally.
      - name: Verify (build · test · cvc5 proofs · clippy · fmt · docs · deny · no-lineage)
        run: ./scripts/verify.sh

  # A change a user would notice ships with its own changelog entry, written while the author
  # still has the context. See changelog.d/README.md.
  changelog:
    name: changelog fragment
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fragments are well-formed
        run: ./scripts/changelog.sh --check

      - name: A user-visible change carries an entry
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed="$(git diff --name-only "${BASE}" "${HEAD}")"
          # Shipped code is anything a reader of the release notes can run. The crates and the
          # SDKs, plus the two examples that are components rather than walkthroughs:
          # ext_authz_adapter (a binary people deploy in front of a gateway) and the MCP
          # server. `examples/` was outside this rule until a behaviour change in the adapter —
          # a duplicated forwarded header going from "authorize whichever copy arrived first"
          # to a 403 — passed the gate with nothing in the release notes. A deployment whose
          # gateway appends rather than replaces those headers starts being refused, which is
          # exactly what a reader needed to be told.
          #
          # Deliberately NOT covered, and each for its own reason:
          #   examples/*/run.sh, mint.py, sign.py   walkthrough scaffolding; the keys are fixed
          #                                          and public and prove nothing outside the demo
          #   examples/*/tests/                      a test is not a user-visible change
          #   examples/*/model/, README.md           fixtures and prose
          #   examples/*/Cargo.lock                  a version bump, not behaviour
          #   docs/, .agent/, .github/, scripts/     none of it changes what a release does
          #
          # Matching on `src/` rather than a file-extension list is what keeps that split
          # honest: an extension list caught mint.py, which is a demo key generator.
          if ! echo "${changed}" | grep -qE '^(crates|sdks)/|^examples/[^/]+/src/|^examples/mcp/server\.py$'; then
            echo "No shipped code touched — no fragment needed."
            exit 0
          fi
          if echo "${changed}" | grep -q '^changelog\.d/.*\.md$'; then
            echo "Fragment present."
            exit 0
          fi
          echo "::error::This pull request changes shipped code (crates/, sdks/, or an example"
          echo "component) but adds no changelog.d/ entry."
          echo "Add one (see changelog.d/README.md), or apply the 'no-changelog' label if a user"
          echo "would notice nothing — a refactor, a test, a comment."
          exit 1
