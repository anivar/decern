# SPDX-License-Identifier: Apache-2.0
name: sdk-typescript

on:
  push:
    paths: ["sdks/typescript/**"]
  pull_request:
    paths: ["sdks/typescript/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci || npm i
      - run: npm run build
      - run: npm test
