# SPDX-License-Identifier: Apache-2.0
#
# Runs the worked examples end to end. Separate from the required `ci` gate on the
# store-postgres precedent: the examples need runtimes (uv, jq) the main loop does not,
# and a broken example should be loud without holding every unrelated merge hostage.
#
# cvc5 is installed and the walkthrough always proves — the MCP example's model differs
# from the proven builtin, so "the invariants hold over it" is untested until this runs.
# A prove-skipping green here would be exactly the mistaken-green scripts/verify.sh's
# own --skip-proofs comment forbids.
name: Examples

on:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "crates/**"
      - ".github/workflows/examples.yml"
  pull_request:
    branches: [main]
    paths:
      - "examples/**"
      - "crates/**"
      - ".github/workflows/examples.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Kept in lockstep with ci.yml by hand; the duplication is accepted.
  CVC5_TAG: cvc5-1.3.4

jobs:
  mcp:
    name: mcp walkthrough
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust toolchain (honors rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install cvc5
        run: |
          curl -sSfL -o /tmp/cvc5.zip \
            "https://github.com/cvc5/cvc5/releases/download/${CVC5_TAG}/cvc5-Linux-x86_64-static.zip"
          unzip -q /tmp/cvc5.zip -d /tmp/cvc5
          sudo install -m 0755 /tmp/cvc5/cvc5-Linux-x86_64-static/bin/cvc5 /usr/local/bin/cvc5
          cvc5 --version

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9

      - name: Run the MCP walkthrough
        run: examples/mcp/run.sh
