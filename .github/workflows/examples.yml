# SPDX-License-Identifier: Apache-2.0
#
# Runs the worked examples end to end. Separate from the required `ci` gate on the
# store-postgres precedent: the examples need runtimes (uv, jq) the main loop does not,
# and a broken example should be loud without holding every unrelated merge hostage.
#
# cvc5 is installed and the walkthrough always proves — the MCP example's model differs
# from the proven builtin, so "the invariants hold over it" is untested until this runs.
# A prove-skipping green here would be exactly the mistaken-green scripts/verify.sh's
# own --skip-proofs comment forbids.
name: Examples

# No `paths:` filter, deliberately: the job reports on every PR — a red row is visible
# where the merge happens, instead of absent — and skips its expensive steps itself
# when nothing it tests changed, so an unrelated PR pays seconds. Merge gating stays
# the maintainer's call; a workflow can be wrong too.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Kept in lockstep with ci.yml by hand; the duplication is accepted.
  CVC5_TAG: cvc5-1.3.4

jobs:
  mcp:
    name: mcp walkthrough
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Decide whether anything this job tests changed
        id: relevant
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch -q origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
              | grep -qE '^(examples/mcp/|crates/|[.]github/workflows/examples[.]yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "nothing this job tests changed; reporting success without running"
          fi

      - name: Install Rust toolchain (honors rust-toolchain.toml)
        if: steps.relevant.outputs.run == 'true'
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        if: steps.relevant.outputs.run == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install cvc5
        if: steps.relevant.outputs.run == 'true'
        run: |
          curl -sSfL -o /tmp/cvc5.zip \
            "https://github.com/cvc5/cvc5/releases/download/${CVC5_TAG}/cvc5-Linux-x86_64-static.zip"
          unzip -q /tmp/cvc5.zip -d /tmp/cvc5
          sudo install -m 0755 /tmp/cvc5/cvc5-Linux-x86_64-static/bin/cvc5 /usr/local/bin/cvc5
          cvc5 --version

      - name: Install uv
        if: steps.relevant.outputs.run == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9

      - name: Run the MCP walkthrough
        if: steps.relevant.outputs.run == 'true'
        run: examples/mcp/run.sh
