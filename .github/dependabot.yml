# SPDX-License-Identifier: Apache-2.0
# Dependency updates, grouped weekly so the supply-chain gate (`cargo deny` in
# scripts/verify.sh) is exercised against current versions rather than against
# whatever was pinned at the last release. Security updates are not grouped and
# arrive as soon as the advisory does.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    # cedar-policy and cedar-policy-symcc are pinned exactly (`=`) because the
    # proof harness is built against one cedar version at a time; they move
    # together, by hand, with a proof run — never by a Dependabot PR. Major
    # versions of anything are also by hand: a major bump of a crypto or
    # protocol crate is a change to read, not a PR to wave through.
    ignore:
      - dependency-name: cedar-policy
      - dependency-name: cedar-policy-core
      - dependency-name: cedar-policy-formatter
      - dependency-name: cedar-policy-symcc
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: cargo
    directory: /examples/ext_authz_adapter
    schedule:
      interval: weekly
      day: monday
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # An Actions major is merged on a green run only when CI actually executes the
    # action. These three run only in release.yml, which nothing but a tag triggers,
    # so a green check says nothing about them; their majors are taken by hand with a
    # release dry run on an rc tag.
    ignore:
      - dependency-name: sigstore/cosign-installer
        update-types: ["version-update:semver-major"]
      - dependency-name: softprops/action-gh-release
        update-types: ["version-update:semver-major"]
      - dependency-name: actions/download-artifact
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /sdks/typescript
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /sdks/python
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: gomod
    directory: /sdks/go
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
